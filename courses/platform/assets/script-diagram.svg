<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">重連腳本：先判斷，再嘗試，再驗證</title><desc id="desc">連線正常時監看；斷線依觸發週期提出重連，恢復後驗證品質與更新。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#45735f" stroke-width="2"/></marker></defs><rect width="1000" height="680" fill="#f4f8f4"/><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif;fill:#183e30;font-size:23px}.sub{font-size:20px;fill:#405d50}.title{font-size:30px;font-weight:700}.bold{font-weight:700}</style><text x="40" y="52" class="title">重連腳本：先判斷，再嘗試，再驗證</text><rect x="280" y="95" width="440" height="100" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="300" y="131" class="bold">掃描時檢查 ConnectionStatus</text><text x="300" y="163" class="sub">先核對目前版本的狀態值</text><rect x="65" y="300" width="390" height="125" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="85" y="336" class="bold">已連線</text><text x="85" y="368" class="sub">不發出重連請求</text><text x="85" y="397" class="sub">繼續監看品質與數值</text><rect x="545" y="300" width="390" height="125" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="565" y="336" class="bold">斷線且符合 Trigger period</text><text x="565" y="368" class="sub">Me.Reconnect = true;</text><text x="565" y="397" class="sub">LogMessage 記錄嘗試</text><path d="M380 195 L260 285" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="330.0" y="231.0" class="sub">Connected</text><path d="M620 195 L740 285" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="690.0" y="231.0" class="sub">Disconnected</text><rect x="280" y="535" width="440" height="110" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="300" y="571" class="bold">Driver 恢復後驗證</text><text x="300" y="603" class="sub">Connected ＋ Good ＋ PV 更新</text><path d="M740 425 L570 520" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="665.0" y="463.5" class="sub">恢復連線</text></svg>