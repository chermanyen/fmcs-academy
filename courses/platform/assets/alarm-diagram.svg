<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">同一個 PV，三種不同用途</title><desc id="desc">即時值顯示、超限告警與歷史記錄是不同功能；Ack 不代表數值恢復。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#45735f" stroke-width="2"/></marker></defs><rect width="1000" height="680" fill="#f4f8f4"/><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif;fill:#183e30;font-size:23px}.sub{font-size:20px;fill:#405d50}.title{font-size:30px;font-weight:700}.bold{font-weight:700}</style><text x="40" y="52" class="title">同一個 PV，三種不同用途</text><rect x="70" y="105" width="860" height="110" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="90" y="141" class="bold">Temperature001.PV = 80（教學測試值）</text><text x="90" y="173" class="sub">先確認 PV 品質 Good，再觀察不同功能。</text><rect x="45" y="375" width="280" height="165" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="65" y="411" class="bold">即時值</text><text x="65" y="443" class="sub">畫面顯示 80</text><text x="65" y="472" class="sub">這一刻的狀態</text><rect x="360" y="375" width="280" height="165" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="380" y="411" class="bold">Alarm 告警</text><text x="380" y="443" class="sub">Hi 門檻 = 75</text><text x="380" y="472" class="sub">超限事件，可確認</text><rect x="675" y="375" width="280" height="165" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="695" y="411" class="bold">History 歷史</text><text x="695" y="443" class="sub">記錄值與時間</text><text x="695" y="472" class="sub">Trend 顯示時間變化</text><path d="M350 215 L185 360" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 215 L500 360" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 215 L815 360" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="65" y="615" class="sub">Ack 只代表確認告警，不代表 PV 已恢復正常。</text><text x="65" y="650" class="sub">歷史功能需另有 Historian 設定、服務及授權。</text></svg>