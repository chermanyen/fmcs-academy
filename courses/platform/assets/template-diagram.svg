<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">一份模板，建立多台 AHU 實例</title><desc id="desc">共用模板建立 AHU_001、AHU_002，各有自己的屬性值。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#45735f" stroke-width="2"/></marker></defs><rect width="1000" height="680" fill="#f4f8f4"/><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif;fill:#183e30;font-size:23px}.sub{font-size:20px;fill:#405d50}.title{font-size:30px;font-weight:700}.bold{font-weight:700}</style><text x="40" y="52" class="title">一份模板，建立多台 AHU 實例</text><rect x="290" y="100" width="420" height="150" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="310" y="136" class="bold">AHU_Template：共用設備定義</text><text x="310" y="168" class="sub">SupplyTemp：Float</text><text x="310" y="197" class="sub">RunStatus / Alarm：Boolean</text><rect x="65" y="380" width="405" height="155" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="85" y="416" class="bold">AHU_001：第一台設備</text><text x="85" y="448" class="sub">SupplyTemp = 24.5 °C</text><text x="85" y="477" class="sub">RunStatus = true</text><rect x="530" y="380" width="405" height="155" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="550" y="416" class="bold">AHU_002：第二台設備</text><text x="550" y="448" class="sub">SupplyTemp = 26.0 °C</text><text x="550" y="477" class="sub">RunStatus = false</text><path d="M410 250 L270 365" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="350.0" y="298.5" class="sub">建立實例</text><path d="M590 250 L730 365" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="670.0" y="298.5" class="sub">建立實例</text><text x="65" y="605" class="sub">類比 C#：Template 像類別，Instance 像實體，Attribute 像屬性。</text><text x="65" y="640" class="sub">圖中數值僅作示意；AHU_002 是補充教學例子。</text></svg>