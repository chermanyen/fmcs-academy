<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">Galaxy、IDE、執行環境：三件不同的事</title><desc id="desc">IDE 編輯 Galaxy；Galaxy 設定部署到 WinPlatform 與 AppEngine，AppEngine 執行 AHU 實例。Area 是邏輯分組。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#45735f" stroke-width="2"/></marker></defs><rect width="1000" height="680" fill="#f4f8f4"/><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif;fill:#183e30;font-size:23px}.sub{font-size:20px;fill:#405d50}.title{font-size:30px;font-weight:700}.bold{font-weight:700}</style><text x="40" y="52" class="title">Galaxy、IDE、執行環境：三件不同的事</text><rect x="40" y="105" width="270" height="145" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="60" y="141" class="bold">IDE：工程工具</text><text x="60" y="173" class="sub">像 Visual Studio</text><text x="60" y="202" class="sub">編輯、Check-in、Deploy</text><rect x="450" y="105" width="490" height="145" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="470" y="141" class="bold">Galaxy：專案儲存庫</text><text x="470" y="173" class="sub">模板、實例、設定</text><text x="470" y="202" class="sub">底層使用 SQL Server</text><path d="M310 175 L435 175" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="372.5" y="151.0" text-anchor="middle" class="sub">編輯設定</text><rect x="80" y="350" width="840" height="250" rx="14" fill="#e6f2e8" stroke="#9ebaa9" stroke-width="2"/><text x="100" y="386" class="bold">執行環境（Deployment View）</text><rect x="110" y="414" width="245" height="138" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="130" y="450" class="bold">WinPlatform</text><text x="130" y="482" class="sub">對應執行主機</text><text x="130" y="511" class="sub">不是設備分組</text><rect x="390" y="414" width="230" height="138" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="410" y="450" class="bold">AppEngine</text><text x="410" y="482" class="sub">物件執行引擎</text><text x="410" y="511" class="sub">執行物件腳本</text><rect x="660" y="414" width="230" height="138" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="680" y="450" class="bold">AHU_001</text><text x="680" y="482" class="sub">設備物件</text><text x="680" y="511" class="sub">屬性：SupplyTemp</text><path d="M355 480 L380 480" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M620 480 L650 480" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M700 250 L700 335" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="710.0" y="283.5" class="sub">Deploy</text><text x="85" y="640" class="sub">Area：邏輯設備／區域分組，與主機上的部署位置是不同視角。</text></svg>