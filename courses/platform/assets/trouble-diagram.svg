<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">用資料流定位故障：從哪裡開始不更新？</title><desc id="desc">比較模擬器、Object Viewer 與圖控畫面，定位第一個不更新的節點。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#45735f" stroke-width="2"/></marker></defs><rect width="1000" height="680" fill="#f4f8f4"/><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif;fill:#183e30;font-size:23px}.sub{font-size:20px;fill:#405d50}.title{font-size:30px;font-weight:700}.bold{font-weight:700}</style><text x="40" y="52" class="title">用資料流定位故障：從哪裡開始不更新？</text><rect x="280" y="90" width="440" height="110" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="300" y="126" class="bold">PV 不更新：先改模擬器數值</text><text x="300" y="158" class="sub">用單一變因重現問題</text><rect x="60" y="320" width="395" height="140" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="80" y="356" class="bold">上游資料就不更新</text><text x="80" y="388" class="sub">查模擬器、IP / port</text><text x="80" y="417" class="sub">Driver Activate / Topic / Item</text><rect x="545" y="320" width="395" height="140" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="565" y="356" class="bold">Object Viewer 更新，畫面不動</text><text x="565" y="388" class="sub">查 Graphic 屬性參照</text><text x="565" y="417" class="sub">檢查部署與畫面綁定</text><path d="M380 200 L260 305" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="330.0" y="243.5" class="sub">Object Viewer 不變</text><path d="M620 200 L740 305" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="690.0" y="243.5" class="sub">Object Viewer 有變</text><rect x="230" y="550" width="540" height="100" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="250" y="586" class="bold">記錄第一個異常點</text><text x="250" y="618" class="sub">時間、物件、值、Quality、錯誤訊息</text><path d="M260 460 L380 535" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M740 460 L620 535" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/></svg>