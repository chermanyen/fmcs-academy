<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">FMCS 是怎麼工作的？</title><desc id="desc">現場設備經通訊及 Galaxy 處理後提供圖控與歷史；IT 依值、品質及日誌排錯。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#45735f" stroke-width="2"/></marker></defs><rect width="1000" height="680" fill="#f4f8f4"/><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif;fill:#183e30;font-size:23px}.sub{font-size:20px;fill:#405d50}.title{font-size:30px;font-weight:700}.bold{font-weight:700}</style><text x="40" y="52" class="title">FMCS 是怎麼工作的？</text><rect x="65" y="110" width="390" height="145" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="85" y="146" class="bold">1. 現場設備</text><text x="85" y="178" class="sub">AHU 空氣處理機</text><text x="85" y="207" class="sub">感測器量到溫度</text><rect x="545" y="110" width="390" height="145" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="565" y="146" class="bold">2. 通訊與運算</text><text x="565" y="178" class="sub">PLC → OI Server → Galaxy</text><text x="565" y="207" class="sub">設備資料轉成物件屬性</text><rect x="545" y="390" width="390" height="145" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="565" y="426" class="bold">3. 操作員畫面</text><text x="565" y="458" class="sub">InTouch 顯示數值與告警</text><text x="565" y="487" class="sub">Historian 記錄歷史（需設定）</text><rect x="65" y="390" width="390" height="145" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="85" y="426" class="bold">4. IT 排錯證據</text><text x="85" y="458" class="sub">值有變嗎？品質 Good 嗎？</text><text x="85" y="487" class="sub">先查第一個異常節點</text><path d="M455 180 L535 180" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M740 255 L740 375" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/><path d="M545 460 L465 460" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/></svg>