<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">畫面上兩種不同資訊，不要混在一起</title><desc id="desc">Active 狀態決定選用來源；ConnectionStatus 與 PV 品質表示通訊與資料有效性。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#45735f" stroke-width="2"/></marker></defs><rect width="1000" height="680" fill="#f4f8f4"/><style>text{font-family:'Microsoft JhengHei','Noto Sans CJK TC',sans-serif;fill:#183e30;font-size:23px}.sub{font-size:20px;fill:#405d50}.title{font-size:30px;font-weight:700}.bold{font-weight:700}</style><text x="40" y="52" class="title">畫面上兩種不同資訊，不要混在一起</text><rect x="50" y="100" width="420" height="145" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="70" y="136" class="bold">來源一：Active 狀態</text><text x="70" y="168" class="sub">DISourceActive</text><text x="70" y="197" class="sub">決定 P / B 哪一盞燈亮</text><rect x="530" y="100" width="420" height="145" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="550" y="136" class="bold">來源二：連線與品質</text><text x="550" y="168" class="sub">ConnectionStatus / PV.Quality</text><text x="550" y="197" class="sub">決定狀態文字與資料有效性</text><rect x="120" y="370" width="760" height="230" rx="14" fill="#e6f2e8" stroke="#9ebaa9" stroke-width="2"/><text x="140" y="406" class="bold">Industrial Graphic：PLC_002 狀態面板</text><rect x="150" y="440" width="300" height="120" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="170" y="476" class="bold">P：Active</text><text x="170" y="508" class="sub">目前選用 Primary</text><rect x="520" y="440" width="330" height="120" rx="14" fill="#fff" stroke="#9ebaa9" stroke-width="2"/><text x="540" y="476" class="bold">State：Connected</text><text x="540" y="508" class="sub">PV 品質：Good</text><path d="M260 245 L260 355" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="270.0" y="291.0" class="sub">綁定燈號</text><path d="M740 245 L740 355" stroke="#45735f" fill="none" stroke-width="3" marker-end="url(#arrow)"/><text x="750.0" y="291.0" class="sub">綁定文字</text><text x="120" y="645" class="sub">「主用綠燈」不能單獨證明 PLC 資料正常，還要一起看品質。</text></svg>